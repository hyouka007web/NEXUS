name: nexus
description: >
  NEXUS Browser — Chromium-based Browser mit Vivaldi-artigem Sidebar-UI,
  echtem Adblocker, tiefem Video-/Media-Scraper (DOM + Netzwerk-Sniffing +
  Iframe-Nachladen) und Downloadmanager mit Qualitätsauswahl.
publish_to: 'none'
version: 0.2.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # Haupt-Webview: Nutzt Android Chromium mit shouldInterceptRequest,
  # shouldOverrideUrlLoading und onCreateWindow für Adblock/Redirect-/Popup-Schutz
  flutter_inappwebview: ^6.1.5

  # App-weites State-Management (Tabs, Adblock-Status, Downloads)
  provider: ^6.1.2

  # App-privates Speicherverzeichnis für heruntergeladene Videos
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/nexus_logo.png
    - assets/filters/easylist_sample.txt
