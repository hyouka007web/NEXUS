name: nexus
description: >
  NEXUS Browser — Chromium-based Browser mit Vivaldi-artigem Sidebar-UI,
  echtem Adblocker, tiefem Video-/Media-Scraper (DOM + Netzwerk-Sniffing +
  Iframe-Nachladen) und Downloadmanager mit Qualitätsauswahl.
publish_to: 'none'
version: 0.2.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # Haupt-Webview: Nutzt Android Chromium mit shouldInterceptRequest,
  # shouldOverrideUrlLoading und onCreateWindow für Adblock/Redirect-/Popup-Schutz
  flutter_inappwebview: ^6.1.5

  # App-weites State-Management (Tabs, Adblock-Status, Downloads)
  provider: ^6.1.2

  # App-privates Speicherverzeichnis für heruntergeladene Videos
  path_provider: ^2.1.0

  # Typografie: Chakra Petch (UI) + JetBrains Mono (technische Inhalte)
  google_fonts: ^6.2.1

  # Persistenz des Start-Page-Layouts je Workspace
  shared_preferences: ^2.2.3

  # Datei öffnen (Mediathek: "Datei öffnen") und teilen (Mediathek: "Datei teilen")
  open_filex: ^4.5.0
  share_plus: ^10.1.2

  # Integrierter Video-/Audio-Player mit Wiedergabeposition
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/nexus_logo.png
    - assets/filters/easylist_sample.txt
