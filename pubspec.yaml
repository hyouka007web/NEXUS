name: nexus
description: >
  NEXUS Browser — Chromium-based browser with advanced scraping capabilities.
  Uses flutter_inappwebview for request interception, adblocking,
  video harvesting, and ARD Mediathek support.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # Haupt-Webview: Nutzt Android Chromium mit shouldInterceptRequest
  flutter_inappwebview: ^6.1.5

  google_fonts: ^6.2.1
  provider: ^6.1.2

  # Für Video-Downloader: app-privates Speicherverzeichnis
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/nexus_logo.png
    - assets/filters/easylist_sample.txt
