org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# AGP 9's built-in Kotlin resolved a newer kotlin-stdlib (2.4.10) than its own
# bundled compiler (2.2.0) can read, breaking compilation. Going back to
# explicitly applying the Kotlin Gradle plugin (see build.gradle.kts) gives
# full control over the Kotlin version instead of AGP's auto-picked one.
android.builtInKotlin=false
