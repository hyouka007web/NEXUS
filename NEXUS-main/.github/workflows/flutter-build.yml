name: Build NEXUS (Flutter, Stufe 0)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Manuell startbar über den Actions-Tab, ohne extra Commit — praktisch
  # zum Wiederholen eines Builds nach einer reinen Konfigurationsänderung.
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.24.5"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 (für Android-Gradle-Build)
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Android-Plattformordner erzeugen (fehlt im Repo, wird nicht committed)
        # --project-name explizit gesetzt: ohne das leitet "flutter create ."
        # den Namen vom aktuellen Ordner ab — und der heißt hier "NEXUS"
        # (Großbuchstaben, kommt vom Repo-Namen), was kein gültiger
        # Dart-Paketname ist. Muss zu "name:" in pubspec.yaml passen.
        run: flutter create --platforms=android --org com.nexus.browser --project-name nexus_flutter .

      - run: flutter pub get
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-flutter-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Windows-Plattformordner erzeugen (fehlt im Repo, wird nicht committed)
        run: flutter create --platforms=windows --org com.nexus.browser --project-name nexus_flutter .

      - run: flutter pub get
      - run: flutter build windows --debug

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-flutter-windows-debug
          path: build/windows/x64/runner/Debug/

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Linux-Build-Abhängigkeiten (GTK, CMake, Ninja)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev liblzma-dev clang cmake pkg-config

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Linux-Plattformordner erzeugen (fehlt im Repo, wird nicht committed)
        run: flutter create --platforms=linux --org com.nexus.browser --project-name nexus_flutter .

      - run: flutter pub get
      - run: flutter build linux --debug

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-flutter-linux-debug
          path: build/linux/x64/debug/bundle/
