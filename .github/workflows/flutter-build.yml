name: Build NEXUS (Android / Linux / Windows)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.24.0"
  PROJECT_NAME: "nexus_flutter"
  ORG: "com.nexus.browser"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: false

      # FIX: Remove existing android/ folder to prevent flutter create conflicts
      # Then generate a fresh one
      - name: Android-Ordner erzeugen
        run: |
          rm -rf android/
          echo "=== Running flutter create --platforms=android ==="
          set +e
          flutter create --platforms=android . 2>&1
          FLUTTER_EXIT=$?
          echo "=== flutter create exit code: $FLUTTER_EXIT ==="
          echo "=== Checking android dir ==="
          ls -la android/ 2>&1 || echo "android/ dir not created"
          echo "=== Generated build.gradle ==="
          grep "compileSdk" android/app/build.gradle 2>&1 || true

      - name: Flutter pub get (Android)
        run: |
          set +e
          flutter pub get -v 2>&1
          PUB_EXIT=$?
          echo "=== pub get exit code: $PUB_EXIT ==="

      # FIX: Lower compileSdkVersion to 34 (Flutter 3.24 may default to 35,
      #       which may not be installed on ubuntu-latest runners)
      - name: Set compileSdkVersion to 34
        run: |
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' android/app/build.gradle
            sed -i 's/compileSdk flutter.compileSdk/compileSdk 34/g' android/app/build.gradle
            sed -i 's/compileSdk[s]* = [0-9]*/compileSdk 34/g' android/app/build.gradle
            sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion 34/g' android/app/build.gradle
            sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 34/g' android/app/build.gradle
            sed -i 's/compileSdk [0-9]*/compileSdk 34/g' android/app/build.gradle
          fi

      - name: Build APK
        run: |
          set +e
          flutter build apk --release > /tmp/apk-build.log 2>&1 || true
          echo "=== Build exit code: $? ==="
          cp /tmp/apk-build.log /tmp/build-log.txt
          echo "=== All files in build dir ==="
          ls -la /tmp/apk-build.log
          wc -l /tmp/apk-build.log
          echo "=== Full build log ==="
          cat /tmp/apk-build.log
          echo "=== APK files ==="
          find build/ -name "*.apk" -type f 2>/dev/null || echo "No APK files found"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: /tmp/build-log.txt

      - name: Find and Upload APK
        run: |
          echo "=== Searching for APK files ==="
          find build/app/outputs/ -name "*.apk" -type f 2>/dev/null || true
          find build/ -name "*.apk" -type f 2>/dev/null || true
          APK_FILE=$(find build/app/outputs/flutter-apk/ -name "*.apk" -print -quit 2>/dev/null)
          if [ -n "$APK_FILE" ]; then
            echo "Found APK: $APK_FILE"
            cp "$APK_FILE" ./nexus-android.apk
          else
            echo "No APK found in expected location, searching all build output..."
            find build/ -name "*.apk" -type f 2>/dev/null | head -1 | while read -r f; do
              echo "Found: $f"
              cp "$f" ./nexus-android.apk
            done
          fi
          ls -la ./nexus-android.apk 2>/dev/null || echo "APK not found anywhere"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-android-apk
          path: nexus-android.apk
          if-no-files-found: warn

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Linux-Build-Abhängigkeiten
        run: |
          sudo apt-get update
          sudo apt-get install -y             ninja-build libgtk-3-dev liblzma-dev clang cmake pkg-config             libblkid-dev libsecret-1-dev libjsoncpp-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: false

      - name: Linux-Ordner erzeugen
        run: |
          rm -rf linux/
          echo "=== Running flutter create ==="
          set +e
          flutter create --platforms=linux . 2>&1
          FLUTTER_EXIT=$?
          echo "=== flutter create exit code: $FLUTTER_EXIT ==="

      - name: Flutter pub get (Android)
        run: |
          set +e
          flutter pub get -v 2>&1
          PUB_EXIT=$?
          echo "=== pub get exit code: $PUB_EXIT ==="
      - name: Build Linux
        run: |
          set +e
          flutter build linux --release > /tmp/linux-build.log 2>&1
          BUILD_EXIT=$?
          echo "=== Build exit code: $BUILD_EXIT ==="
          echo "=== Full build log ==="
          cat /tmp/linux-build.log

      - name: Linux-Bundle als tar.gz
        run: |
          cd build/linux
          tar -czf ../../nexus-linux-x64.tar.gz x64/release

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-linux-x64
          path: nexus-linux-x64.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: false

      - name: Windows-Ordner erzeugen
        shell: bash
        run: |
          if [ ! -d "windows" ]; then
            flutter create --platforms=windows .
          fi

      - name: Flutter pub get (Android)
        run: |
          set +e
          flutter pub get -v 2>&1
          PUB_EXIT=$?
          echo "=== pub get exit code: $PUB_EXIT ==="
      - run: flutter build windows --release

      - name: Windows-Bundle als zip
        shell: pwsh
        run: |
          if (Test-Path "build\windows\x64\runner\Release") {
            Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath nexus-windows-x64.zip
          } else {
            Write-Host "Windows build directory not found"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-windows-x64
          path: nexus-windows-x64.zip
          if-no-files-found: ignore
