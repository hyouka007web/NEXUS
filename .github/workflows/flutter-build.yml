name: Build NEXUS (Android / Linux / Windows)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.29.0"
  PROJECT_NAME: "nexus_flutter"
  ORG: "com.nexus.browser"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Android-Ordner erzeugen
        run: flutter create --platforms=android --org ${{ env.ORG }} --project-name ${{ env.PROJECT_NAME }} .

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Linux-Build-Abhängigkeiten
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build libgtk-3-dev liblzma-dev clang cmake pkg-config \
            libblkid-dev libsecret-1-dev libjsoncpp-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Linux-Ordner erzeugen
        run: flutter create --platforms=linux --org ${{ env.ORG }} --project-name ${{ env.PROJECT_NAME }} .

      - run: flutter pub get
      - run: flutter build linux --release

      - name: Linux-Bundle als tar.gz
        run: |
          cd build/linux/x64/release
          tar -czf ../../../../nexus-linux-x64.tar.gz bundle

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-linux-x64
          path: nexus-linux-x64.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Windows-Ordner erzeugen
        run: flutter create --platforms=windows --org ${{ env.ORG }} --project-name ${{ env.PROJECT_NAME }} .

      - run: flutter pub get
      # windows-latest has VS 2022 pre-installed, but Flutter 3.29
      # hardcodes CMake generator "Visual Studio 16 2019" (compiled).
      # CMake needs VS 2019 findable by vswhere. We install VS 2019
      # Build Tools via choco (properly registers with vswhere).
      # The C1001 ICE occurs with VS 2019's MSVC on webview_windows,
      # so we override CMAKE_GENERATOR_TOOLSET to v143 (VS 2022's compiler,
      # which is also on the windows-latest runner).
      - name: Install VS 2019 Build Tools
        shell: pwsh
        run: |
          choco install visualstudio2019buildtools --params "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended --passive --norestart --wait" -y --no-progress
          Write-Host "VS 2019 install exit: $LASTEXITCODE"
      - name: Build Windows
        shell: pwsh
        run: |
          # The webview_windows C++ plugin triggers C1001 ICE in MSVC's
          # winrt/base.h (C++/WinRT) when compiled with VS 2019's cl.exe.
          # Fix: add /Zc:preprocessor globally to all C++ targets by
          # appending it to the main CMakeLists.txt before flutter builds.
          $mainCmake = "windows\CMakeLists.txt"
          if (Test-Path $mainCmake) {
            Add-Content $mainCmake ""
            Add-Content $mainCmake "# Workaround C1001 ICE in C++/WinRT (webview_windows)"
            Add-Content $mainCmake 'add_compile_options("/Zc:preprocessor;/bigobj")'
            Write-Host "Patched windows/CMakeLists.txt with /Zc:preprocessor"
          } else {
            Write-Host "windows/CMakeLists.txt not found — flutter create will generate it"
          }
          flutter build windows --release

      - name: Windows-Bundle als zip
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath nexus-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-windows-x64
          path: nexus-windows-x64.zip
          if-no-files-found: error
