name: Build NEXUS (Android / Linux / Windows)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.29.0"
  PROJECT_NAME: "nexus_flutter"
  ORG: "com.nexus.browser"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Android-Ordner erzeugen
        run: flutter create --platforms=android --org ${{ env.ORG }} --project-name ${{ env.PROJECT_NAME }} .

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Linux-Build-Abhängigkeiten
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build libgtk-3-dev liblzma-dev clang cmake pkg-config \
            libblkid-dev libsecret-1-dev libjsoncpp-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Linux-Ordner erzeugen
        run: flutter create --platforms=linux --org ${{ env.ORG }} --project-name ${{ env.PROJECT_NAME }} .

      - run: flutter pub get
      - run: flutter build linux --release

      - name: Linux-Bundle als tar.gz
        run: |
          cd build/linux/x64/release
          tar -czf ../../../../nexus-linux-x64.tar.gz bundle

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-linux-x64
          path: nexus-linux-x64.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Windows-Ordner erzeugen
        run: flutter create --platforms=windows --org ${{ env.ORG }} --project-name ${{ env.PROJECT_NAME }} .

      - run: flutter pub get
      # windows-latest has VS 2022 pre-installed. Flutter hardcodes the
      # CMake generator as "Visual Studio 16 2019" (in compiled Dart code,
      # not source — patching source has no effect). We need VS 2019 to be
      # findable by vswhere/CMake. Instead of choco (which failed to register
      # properly with vswhere), we install VS 2019 Build Tools directly from
      # Microsoft's installer with the C++ workload.
      # Then we override CMAKE_GENERATOR_TOOLSET to v143 (VS 2022's compiler)
      # to avoid the C1001 ICE in VS 2019's cl.exe on webview_windows.
      - name: Install VS 2019 Build Tools
        shell: pwsh
        run: |
          Write-Host "Installing VS 2019 Build Tools with C++ tools..."
          $vs19url = "https://aka.ms/vs/16/release/vs_BuildTools.exe"
          $vs19path = "$env:TEMP\vs2019buildtools.exe"
          Invoke-WebRequest -Uri $vs19url -OutFile $vs19path
          & $vs19path --add Microsoft.VisualStudio.Workload.VCTools --add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 --includeRecommended --passive --norestart --wait
          Write-Host "VS 2019 Build Tools install complete."
      - name: Build Windows
        shell: pwsh
        env:
          CMAKE_GENERATOR: "Visual Studio 16 2019"
          CMAKE_GENERATOR_TOOLSET: "v143"
        run: flutter build windows --release

      - name: Windows-Bundle als zip
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath nexus-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-windows-x64
          path: nexus-windows-x64.zip
          if-no-files-found: error
