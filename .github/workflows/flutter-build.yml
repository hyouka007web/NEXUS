name: Build NEXUS (Android / Linux / Windows)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.29.0"
  PROJECT_NAME: "nexus_flutter"
  ORG: "com.nexus.browser"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Android-Ordner erzeugen
        run: flutter create --platforms=android --org ${{ env.ORG }} --project-name ${{ env.PROJECT_NAME }} .

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Linux-Build-Abhängigkeiten
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build libgtk-3-dev liblzma-dev clang cmake pkg-config \
            libblkid-dev libsecret-1-dev libjsoncpp-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Linux-Ordner erzeugen
        run: flutter create --platforms=linux --org ${{ env.ORG }} --project-name ${{ env.PROJECT_NAME }} .

      - run: flutter pub get
      - run: flutter build linux --release

      - name: Linux-Bundle als tar.gz
        run: |
          cd build/linux/x64/release
          tar -czf ../../../../nexus-linux-x64.tar.gz bundle

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-linux-x64
          path: nexus-linux-x64.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Windows-Ordner erzeugen
        run: flutter create --platforms=windows --org ${{ env.ORG }} --project-name ${{ env.PROJECT_NAME }} .

      - run: flutter pub get
      # windows-latest has VS 2022 pre-installed, but Flutter hardcodes the
      # "Visual Studio 16 2019" CMake generator in its windows.dart.
      # Patch it at build time to use VS 2022 generator instead.
      - name: Patch Flutter to use VS 2022 generator
        shell: pwsh
        run: |
          $w = "$env:FLUTTER_ROOT\packages\flutter_tools\lib\src\build_system\targets\windows.dart"
          if (Test-Path $w) {
            (Get-Content $w -Raw) -replace 'Visual Studio 16 2019', 'Visual Studio 17 2022' | Set-Content $w
            Write-Host "Patched windows.dart: VS 2019 -> VS 2022"
          } else {
            Write-Host "WARNING: windows.dart not found"
          }
      - run: flutter build windows --release

      - name: Windows-Bundle als zip
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath nexus-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-windows-x64
          path: nexus-windows-x64.zip
          if-no-files-found: error
