name: Build NEXUS (Android / Linux / Windows)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.24.0"
  PROJECT_NAME: "nexus_flutter"
  ORG: "com.nexus.browser"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      # Generate android/ folder if it doesn't exist
      - name: Android-Ordner erzeugen
        run: |
          if [ ! -d "android/app" ]; then
            flutter create --platforms=android --org ${{ env.ORG }} --project-name ${{ env.PROJECT_NAME }} .
          fi

      - run: flutter pub get
      
      # FIX: Force compileSdkVersion to 34 in all forms
      # Flutter 3.24 may generate compileSdk 35 which is unavailable on ubuntu-latest
      - name: Set compileSdkVersion to 34
        run: |
          if [ -f "android/app/build.gradle" ]; then
            # Replace compileSdkVersion flutter.compileSdkVersion
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' android/app/build.gradle
            # Replace compileSdk flutter.compileSdk
            sed -i 's/compileSdk flutter.compileSdk/compileSdk 34/g' android/app/build.gradle
            # Replace any compileSdk = <number>
            sed -i 's/compileSdk[s]* = [0-9]*/compileSdk 34/g' android/app/build.gradle
            # Replace any compileSdkVersion = <number>
            sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion 34/g' android/app/build.gradle
            # Replace compileSdkVersion <number>
            sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 34/g' android/app/build.gradle
            # Replace compileSdk <number>
            sed -i 's/compileSdk [0-9]*/compileSdk 34/g' android/app/build.gradle
            echo "=== compileSdk after patch ==="
            grep -n "compileSdk" android/app/build.gradle || true
          fi

      # Build with verbose error output
      - run: flutter build apk --release --verbose 2>&1 | tail -100

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Linux-Build-Abhängigkeiten
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build libgtk-3-dev liblzma-dev clang cmake pkg-config \
            libblkid-dev libsecret-1-dev libjsoncpp-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Linux-Ordner erzeugen
        run: |
          if [ ! -d "linux" ]; then
            flutter create --platforms=linux --org ${{ env.ORG }} --project-name ${{ env.PROJECT_NAME }} .
          fi

      - run: flutter pub get
      # Build with verbose error output
      - run: flutter build linux --release --verbose 2>&1 | tail -100

      - name: Linux-Bundle als tar.gz
        run: |
          cd build/linux/x64/release
          tar -czf ../../../../nexus-linux-x64.tar.gz bundle

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-linux-x64
          path: nexus-linux-x64.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Windows-Ordner erzeugen
        shell: bash
        run: |
          if [ ! -d "windows" ]; then
            flutter create --platforms=windows --org ${{ env.ORG }} --project-name ${{ env.PROJECT_NAME }} .
          fi

      - run: flutter pub get
      # Flutter 3.41+ supports VS 2026 (version 18) natively.
      # The windows-latest runner has VS 2026 pre-installed.
      - run: flutter build windows --release

      - name: Windows-Bundle als zip
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath nexus-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-windows-x64
          path: nexus-windows-x64.zip
          if-no-files-found: error
