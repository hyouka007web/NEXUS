pluginManagement {
    def flutterProperties = new Properties()
    def flutterPropertiesFile = rootProject.file('flutter.properties')
    if (flutterPropertiesFile.exists()) {
        flutterPropertiesFile.withReader('UTF-8') { reader ->
            flutterProperties.load(reader)
        }
    }
    def flutterRoot = flutterProperties.getProperty('flutter.sdk')
    if (flutterRoot == null) {
        throw new GradleException("Flutter SDK not found. Set flutter.sdk in android/flutter.properties")
    }

    includeBuild("$flutterRoot/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
    }

    plugins {
        id 'dev.flutter.flutter' version '1.0.0' apply false
        id 'com.android.application' version '8.3.0' apply false
        id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
    }
}

plugins {
    id 'dev.flutter.flutter' version '1.0.0' apply false
    id 'com.android.application' version '8.3.0' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
}

rootProject.name = 'nexus'
include ':app'
