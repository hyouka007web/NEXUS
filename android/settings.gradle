include ":app"

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream ->
        localProperties.load(stream)
    }
}

def flutterSdkPath = localProperties.getProperty("flutter.sdk")
if (flutterSdkPath == null) {
    throw new GradleException("flutter.sdk not set in local.properties")
}

// Flutter's plugin evaluation
setBinding(new Binding([flutterSdkPath: flutterSdkPath]))
evaluate(new File(flutterSdkPath, "packages/flutter_tools/gradle"))
